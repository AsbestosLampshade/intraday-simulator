name: CI
on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
jobs:
  ci:
    runs-on: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -U ruff pytest
      - run: ruff check .
      - run: pytest -q
